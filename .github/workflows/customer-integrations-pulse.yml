name: Customer Integrations Pulse Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/customer-integrations-pulse.yml'
      - 'scripts/customer_integrations_pulse.py'
      - 'tests/test_customer_integrations_pulse.py'
      - 'operations/customer-integrations-pulse.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
