name: Sync Design Toolkit

on:
  schedule:
    # Run daily at 9 AM UTC (2 AM PT / 2:30 PM IST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Design skills and agent changes
        env:
          GH_TOKEN: ${{ secrets.BEACON_PAT }}
        run: |
          bash scripts/sync-check.sh
        id: sync

      - name: Commit and push if changes found
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/whats-new.md scripts/manifest.json
          git diff --cached --quiet || git commit -m "sync: design toolkit changes detected $(date -u +%Y-%m-%d)"
          git pull --rebase && git push

      - name: Trigger site deploy
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify-failure.py
