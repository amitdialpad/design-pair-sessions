name: Sync Beacon Changes

on:
  schedule:
    # Run daily at 9:30 AM UTC (3 PM IST) — staggered from other syncs
    - cron: '30 9 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and sync Beacon monorepo changes
        env:
          GH_TOKEN: ${{ secrets.BEACON_PAT }}
        id: sync
        run: python3 scripts/sync-releases.py
        continue-on-error: true

      - name: Commit and push if updated
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ scripts/last-beacon-change.json
          git diff --cached --quiet || git commit -m "sync: beacon changes updated $(date -u +%Y-%m-%d)"
          git pull --rebase && git push

      - name: Trigger site deploy
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo amitdialpad/design-pair-sessions

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify-failure.py
