name: Daily Agentic Business Pulse

on:
  schedule:
    # Prewarm well before 09:00 Asia/Kolkata because this repository's scheduled
    # events have recently arrived 4-6 hours late. The runner waits in the cloud
    # until 09:00 IST; odd-minute fallbacks avoid GitHub's busiest cron boundaries.
    - cron: '37 22 * * *'
    - cron: '17 23 * * *'
    - cron: '23 0 * * *'
    - cron: '37 1 * * *'
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the current Glean draft and retain a relay draft without sending
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/daily-agentic-business-pulse.yml'
      - 'operations/daily-agentic-business-pulse.md'
      - 'scripts/agentic_business_pulse.py'
      - 'scripts/failure_notification.py'
      - 'scripts/run-agentic-business-pulse.py'
      - 'scripts/notify-failure.py'
      - 'skills/daily-agentic-business-pulse/**'
      - 'tests/test_agentic_business_pulse.py'
      - 'tests/test_failure_notification.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate automation
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  pulse:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: daily-agentic-business-pulse
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate, validate, persist, and deliver pulse
        id: pulse
        env:
          PULSE_RECIPIENT: amit.ayre@dialpad.com
          PULSE_TIMEZONE: Asia/Kolkata
          PULSE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          PULSE_INPUT_MODE: glean_gmail_draft
          PULSE_NOT_BEFORE_LOCAL_TIME: ${{ github.event_name == 'schedule' && '09:00' || '' }}
          PULSE_SKILL_PATH: skills/daily-agentic-business-pulse/SKILL.md
          PULSE_REPORTS_DIR: reports/agentic_business_pulse
          PULSE_SOURCE_MAX_AGE_HOURS: '12'
          PULSE_GLEAN_DRAFT_WAIT_SECONDS: '1800'
          PULSE_GLEAN_DRAFT_POLL_SECONDS: '30'
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_SUBJECT_PREFIX: Daily Agentic Business Pulse needs attention
          FAILURE_DESCRIPTION: The report did not pass its source, freshness, validation, persistence, or delivery checks.
          FAILURE_DEDUPE_DAILY: 'true'
          FAILURE_TIMEZONE: Asia/Kolkata
        run: python3 scripts/run-agentic-business-pulse.py

      - name: Persist private pulse outputs
        if: steps.pulse.outputs.handled_failure != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agentic-business-pulse-${{ github.run_id }}
          path: reports/agentic_business_pulse/
          if-no-files-found: error
          retention-days: 90
